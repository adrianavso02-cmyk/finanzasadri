<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adri Finanzas App</title>
  <meta name="application-name" content="Adri Finanzas App">
  <meta name="theme-color" content="#4338ca">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 text-white shadow-lg">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-6">
      <div><h1 class="text-2xl font-extrabold">¡Hola Adri, veamos tus finanzas! 👋</h1><p class="mt-1 text-sm text-indigo-200">Datos compartidos para todos los visitantes</p></div>
      <button id="authBtn" class="rounded-lg border border-white/30 bg-white/10 px-4 py-2 text-sm">Modo Editor</button>
    </div>
  </header>
  <main class="mx-auto max-w-6xl space-y-6 px-4 py-8">
    <section class="grid gap-4 sm:grid-cols-3">
      <article class="rounded-xl border bg-white p-5 shadow-sm"><p class="text-xs font-bold uppercase text-slate-500">Saldo total USD</p><p id="totalBalance" class="mt-2 text-3xl font-extrabold">$0.00</p></article>
      <article class="rounded-xl border bg-white p-5 shadow-sm"><p class="text-xs font-bold uppercase text-slate-500">Ingresos acumulados</p><p id="totalIncome" class="mt-2 text-3xl font-extrabold text-emerald-600">$0.00</p></article>
      <article class="rounded-xl border bg-white p-5 shadow-sm"><p class="text-xs font-bold uppercase text-slate-500">Egresos acumulados</p><p id="totalExpense" class="mt-2 text-3xl font-extrabold text-rose-600">$0.00</p></article>
    </section>
    <section class="rounded-xl border bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between"><div><h2 class="text-xl font-bold">Bancos y cuentas</h2><p class="text-sm text-slate-500">Saldos en USD</p></div><button id="addAccountBtn" class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white">Nueva cuenta</button></div>
      <div id="accountsGrid" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4"></div>
    </section>
    <section id="editorRegisterSection" class="rounded-xl border bg-white p-5 shadow-sm">
      <h2 class="mb-4 text-xl font-bold">Registrar movimiento</h2>
      <form id="txForm" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
        <select id="txType" class="rounded-lg border p-2"><option value="expense">Egreso</option><option value="income">Ingreso</option></select>
        <select id="txAccount" class="rounded-lg border p-2" required></select>
        <input id="txCategory" class="rounded-lg border p-2" placeholder="Categoría" required>
        <input id="txAmount" type="number" min="0.01" step="0.01" class="rounded-lg border p-2" placeholder="Monto USD" required>
        <input id="txPerson" class="rounded-lg border p-2" placeholder="Persona (opcional)">
        <input id="txDate" type="date" class="rounded-lg border p-2" required>
        <input id="txDesc" class="rounded-lg border p-2 sm:col-span-2" placeholder="Descripción (opcional)">
        <button class="rounded-lg bg-emerald-600 px-4 py-2 font-semibold text-white sm:col-span-2 lg:col-span-4" type="submit">Guardar movimiento</button>
      </form>
    </section>
    <section class="rounded-xl border bg-white p-5 shadow-sm">
      <h2 class="mb-4 text-xl font-bold">Historial de transacciones</h2>
      <div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-50 text-xs uppercase"><tr><th class="p-3">Fecha</th><th class="p-3">Tipo</th><th class="p-3">Cuenta</th><th class="p-3">Categoría / detalle</th><th class="p-3 text-right">Monto USD</th><th class="editor-control hidden p-3">Acciones</th></tr></thead><tbody id="txTableBody" class="divide-y"></tbody></table></div>
    </section>
  </main>
  <script>
    const DEFAULT_ACCOUNTS = [
      { id: "1", name: "CaixaBank", balance: 500, color: "#00a0e3", currency: "USD" },
      { id: "2", name: "Wells Fargo", balance: 1200, color: "#d12027", currency: "USD" },
      { id: "3", name: "Binance", balance: 350, color: "#f0b90b", currency: "USD" },
      { id: "4", name: "Bizum", balance: 150, color: "#00b2a9", currency: "USD" }
    ];
    let accounts = JSON.parse(localStorage.getItem("adri_accounts") || "null") || DEFAULT_ACCOUNTS;
    let transactions = JSON.parse(localStorage.getItem("adri_transactions") || "[]");
    const money = n => `$${(Number(n) || 0).toFixed(2)}`;
    const esc = s => String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function updateUI() {
      const grid = document.getElementById("accountsGrid");
      const select = document.getElementById("txAccount");
      const previous = select.value;
      grid.replaceChildren();
      select.replaceChildren();
      let total = 0;
      accounts.forEach(a => {
        const balance = Number(a.balance) + transactions.filter(t => t.accountId === a.id).reduce((s,t) => s + (t.type === "income" ? 1 : -1) * Number(t.amountUsd || t.origAmount || 0), 0);
        total += balance;
        const card = document.createElement("div");
        card.className = "rounded-lg border bg-slate-50 p-4";
        card.style.borderLeft = `4px solid ${a.color || "#4f46e5"}`;
        card.innerHTML = `<strong>${esc(a.name)}</strong><p class="mt-2 text-xl font-bold">${money(balance)}</p><p class="text-xs text-slate-500">Saldo inicial: ${money(a.balance)}</p>`;
        grid.append(card);
        const option = document.createElement("option"); option.value = a.id; option.textContent = a.name; select.append(option);
      });
      if (accounts.some(a => a.id === previous)) select.value = previous;
      document.getElementById("totalBalance").textContent = money(total);
      const income = transactions.filter(t => t.type === "income").reduce((s,t) => s + Number(t.amountUsd || 0), 0);
      const expense = transactions.filter(t => t.type === "expense").reduce((s,t) => s + Number(t.amountUsd || 0), 0);
      document.getElementById("totalIncome").textContent = money(income);
      document.getElementById("totalExpense").textContent = money(expense);
      const tbody = document.getElementById("txTableBody"); tbody.replaceChildren();
      transactions.forEach(t => {
        const account = accounts.find(a => a.id === t.accountId);
        const tr = document.createElement("tr");
        tr.innerHTML = `<td class="p-3">${esc(t.date)}</td><td class="p-3">${t.type === "income" ? "Ingreso" : "Egreso"}</td><td class="p-3">${esc(account?.name || "Cuenta no disponible")}</td><td class="p-3"><strong>${esc(t.category)}</strong><div class="text-xs text-slate-500">${esc(t.desc)}</div></td><td class="p-3 text-right font-bold">${money(t.amountUsd || t.origAmount)}</td><td class="editor-control p-3"><button class="text-rose-600" onclick="deleteTx('${esc(t.id)}')">Eliminar</button></td>`;
        tbody.append(tr);
      });
      document.querySelectorAll(".editor-control").forEach(el => el.classList.remove("hidden"));
    }
    function saveState() {
      localStorage.setItem("adri_accounts", JSON.stringify(accounts));
      localStorage.setItem("adri_transactions", JSON.stringify(transactions));
      updateUI();
    }
    function deleteTx(id) { transactions = transactions.filter(t => t.id !== id); saveState(); }
    document.getElementById("txDate").valueAsDate = new Date();
    document.getElementById("txForm").addEventListener("submit", e => {
      e.preventDefault();
      transactions.unshift({ id: Date.now().toString(), type: document.getElementById("txType").value, accountId: document.getElementById("txAccount").value, category: document.getElementById("txCategory").value.trim(), amountUsd: Number(document.getElementById("txAmount").value), origAmount: Number(document.getElementById("txAmount").value), person: document.getElementById("txPerson").value.trim(), date: document.getElementById("txDate").value, desc: document.getElementById("txDesc").value.trim() });
      e.target.reset(); document.getElementById("txDate").valueAsDate = new Date(); saveState();
    });
    document.getElementById("addAccountBtn").addEventListener("click", () => {
      const name = prompt("Nombre de la nueva cuenta:"); if (!name?.trim()) return;
      const value = Number(prompt("Saldo inicial en USD:", "0")); if (!Number.isFinite(value)) return;
      accounts.push({ id: Date.now().toString(), name: name.trim(), balance: value, color: "#4f46e5", currency: "USD" }); saveState();
    });
    updateUI();
  </script>
  <!-- Configura Firebase copiando firebase-config.example.js a firebase-config.js y poniendo tus datos. -->
  <script src="./firebase-config.js"></script>
  <script src="./shared-storage.js"></script>
</body>
</html>
